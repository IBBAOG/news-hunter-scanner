name: News Hunter scan

on:
  # Disparado pelo cron-job.org a cada 5 min via workflow_dispatch.
  # Nao ha cron interno — GHA schedule e não-confiavel em intervalos curtos.
  workflow_dispatch:

concurrency:
  group: scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # No `cache: pip` on purpose (same class the translate probe hit): the
      # install below runs with --no-cache-dir, so ~/.cache/pip stays empty and
      # the setup-python post-cache step fails the JOB with "Cache folder path
      # ... doesn't exist" even though the scan step exits 0 and writes rows.
      # Dropping the cache leaves a green scan reading green; the install is
      # unchanged (it never populated the cache anyway).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --no-cache-dir -r requirements.txt

      - run: python news_hunter_service.py --once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRASIL_ENERGIA_USER: ${{ secrets.BRASIL_ENERGIA_USER }}
          BRASIL_ENERGIA_PASS: ${{ secrets.BRASIL_ENERGIA_PASS }}
