name: Purge keyword sense exclusions

# Removes keyword labels that news_hunter/keyword_senses.py now classifies as an
# off-topic sense (e.g. 'Compass' on Jeep Compass or Vinci Compass stories) from
# rows already stored in news_articles. The scanner applies the same rule to new
# hits; this job cleans what was stored before it. See
# scripts/purge_keyword_sense_exclusions.py for the decision table.
#
# workflow_dispatch ONLY: a repair pass, not a recurring job.
#   1. Dispatch with apply=false (default) and read the step summary / CSV.
#   2. Re-dispatch with apply=true. Every affected full row is saved to a JSON
#      backup BEFORE any write; the backup is uploaded as an artifact (90 days).
# Run it only while the keyword's match_type is 'exact' in the database
# (Compass: since 2026-09-15), or a substring hit inside the scan window is
# re-tagged by the next scan.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: write changes (default is a dry-run that writes nothing)
        type: boolean
        required: false
        default: false
      days:
        description: only rows with found_at in the last N days
        required: false
        default: '3'
      all_history:
        description: ignore days and scan every tagged row
        type: boolean
        required: false
        default: false
      refetch_missing_evidence:
        description: re-fetch rows whose stored text has no whole-word occurrence (throttled)
        type: boolean
        required: false
        default: false

concurrency:
  group: purge-keyword-sense-exclusions
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # No `cache: pip`: see scan.yml (the --no-cache-dir install leaves the
      # cache folder empty and the setup-python post step would fail the job).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --no-cache-dir -r requirements.txt

      - name: Purge
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRASIL_ENERGIA_USER: ${{ secrets.BRASIL_ENERGIA_USER }}
          BRASIL_ENERGIA_PASS: ${{ secrets.BRASIL_ENERGIA_PASS }}
          APPLY: ${{ inputs.apply }}
          DAYS: ${{ inputs.days || '3' }}
          ALL_HISTORY: ${{ inputs.all_history }}
          REFETCH: ${{ inputs.refetch_missing_evidence }}
        run: |
          case "${DAYS}" in
            ''|*[!0-9]*) echo "days must be a whole number, got '${DAYS}'"; exit 2 ;;
          esac
          ARGS="--days ${DAYS} --output-dir purge_output"
          if [ "${ALL_HISTORY}" = "true" ]; then ARGS="$ARGS --all-history"; fi
          if [ "${REFETCH}" = "true" ]; then ARGS="$ARGS --refetch-missing-evidence"; fi
          if [ "${APPLY}" = "true" ]; then ARGS="$ARGS --apply"; fi
          python -m scripts.purge_keyword_sense_exclusions $ARGS

      # always(): with apply=true the backup must be kept even if a later
      # mutation fails and the step exits non-zero.
      - name: Upload backup and decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purge-keyword-sense-exclusions-${{ github.run_id }}
          path: purge_output/
          retention-days: 90
          if-no-files-found: ignore
