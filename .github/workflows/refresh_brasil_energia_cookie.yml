name: Refresh Brasil Energia cookie

# RETIRED SCHEDULE (2026-11-10). Since 2026-08-24 Cloudflare serves a managed
# challenge (HTTP 403) to GitHub-hosted IPs on every brasilenergia.com.br page,
# /login included, so this job failed on almost every run. The be-auth cookie in
# SectorData's clipping_cookies is now refreshed daily from the SectorData
# self-hosted (residential IP) runner by brasil_energia_cookie_refresh.yml in
# the SectorData repo. Kept for manual runs only.

on:
  workflow_dispatch:

concurrency:
  group: refresh-brasil-energia-cookie
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install --no-cache-dir -r requirements.txt

      - name: Refresh cookie
        run: python -m scripts.refresh_brasil_energia_cookie
        env:
          BRASIL_ENERGIA_USER: ${{ secrets.BRASIL_ENERGIA_USER }}
          BRASIL_ENERGIA_PASS: ${{ secrets.BRASIL_ENERGIA_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
